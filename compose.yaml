# Local PostgreSQL for schema/migration development.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f postgres
#
# The deployed application uses DATABASE_URL from Neon through the HTTPS
# serverless driver. This local container is for SQL inspection and Drizzle
# migrations; the app itself should use a Neon branch URL.

services:
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: local-coach
      RUSTFS_SECRET_KEY: local-coach-storage-password
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - coach_storage_data:/data

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freeappractice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d freeappractice']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis/redis-stack-server:6.2.6-v6
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-upstash-token
      SRH_CONNECTION_STRING: redis://redis:6379

volumes:
  coach_storage_data:
  postgres_data:
  redis_data:
