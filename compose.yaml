# Local MongoDB for development.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f mongodb
#
# Set in .env:
#   DATABASE_URI=mongodb://root:password@localhost:27017/freeappractice?authSource=admin

services:
  mongodb:
    # Keep this pinned: the persistent development volume currently uses FCV 7.0.
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis/redis-stack-server:6.2.6-v6
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-upstash-token
      SRH_CONNECTION_STRING: redis://redis:6379

volumes:
  mongodb_data:
  redis_data:
