name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check
        env:
          # Placeholders so $env/static modules resolve for svelte-check (not real secrets).
          BETTER_AUTH_SECRET: build-time-placeholder-secret-min-32-chars
          BETTER_AUTH_URL: http://localhost:4173
          PUBLIC_BASE_URL: http://localhost:4173
          DATABASE_URL: postgresql://build:placeholder@build-placeholder.neon.tech/neondb?sslmode=require
          OPEN_AI_KEY: sk-ci-placeholder
          PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          RESEND_API_KEY: re_ci
          GITHUB_BUG_REPORT_TOKEN: ghp_ci

      - name: Unit tests
        run: bun run test:unit

  migrate:
    name: Apply Neon migrations
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trim overlength user names
        run: bun run auth:trim-user-names
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Apply additive migrations
        run: bun run db:apply
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
          DRIZZLE_MIGRATIONS_THROUGH: 0019_giant_wolverine

      - name: Backfill question JSONB payloads
        run: bun run db:backfill-question-jsonb
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Apply remaining migrations
        run: bun run db:apply
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Placeholders so $env/static modules resolve at build time (not real secrets).
          BETTER_AUTH_SECRET: build-time-placeholder-secret-min-32-chars
          BETTER_AUTH_URL: http://localhost:4173
          PUBLIC_BASE_URL: http://localhost:4173
          DATABASE_URL: postgresql://build:placeholder@build-placeholder.neon.tech/neondb?sslmode=require
          OPEN_AI_KEY: sk-ci-placeholder
          PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          RESEND_API_KEY: re_ci
          GITHUB_BUG_REPORT_TOKEN: ghp_ci
